services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/billing
      WEBHOOK_SECRET: segredo-local
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
